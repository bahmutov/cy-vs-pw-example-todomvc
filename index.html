<!doctype html>
<html lang="en">
  <body>
    <button id="click" disabled>Click me</button>
    <script>
      const button = document.getElementById('click')
      let enabledTime = null
      setTimeout(() => {
        enabledTime = Date.now()
        console.log('%d button-enabled', enabledTime)
        button.disabled = false
      }, 2000)
      button.addEventListener('click', () => {
        const clickedTime = Date.now()
        console.log('%d button-clicked', clickedTime)
        console.log('clicked after %d ms', clickedTime - enabledTime)
      })
    </script>
  </body>
</html>
